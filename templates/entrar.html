{% extends "base.html" %}
{% block titulo %}Entrar &middot; Stoqo{% endblock %}
{% block contexto %}entrar{% endblock %}

{% block contenido %}
<div class="estrecho">
  <p class="eyebrow">Acceso</p>
  <h1>Entra a tu inventario.</h1>

  {% if error %}<div class="aviso-error">{{ error }}</div>{% endif %}

  <div class="panel">
    <form method="post" action="/entrar">
      <div class="campo">
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" required
               value="{{ datos.correo or '' }}">
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="principal">Entrar</button>
    </form>
  </div>

  <p class="ayuda">No tienes cuenta? <a href="/registro">Crea tu empresa</a>.</p>
</div>
{% endblock %}
